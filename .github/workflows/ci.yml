name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            demo/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r demo/requirements.txt -r requirements-dev.txt
      # No Kaggle credentials or model-proxy keys exist in CI. Tests cover the
      # mechanical scoring, the scenario generator and the demo; none call a model.
      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  demo-boot:
    name: Demo boot check (Streamlit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo/requirements.txt
      # Same install the Streamlit Community Cloud deployment uses.
      - run: pip install -r demo/requirements.txt
      - name: Start the demo and check its health endpoint
        run: |
          streamlit run demo/app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo
              echo "Demo server is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Demo server did not become healthy in time"
          cat streamlit.log
          exit 1
